<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email List</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h2>Inbox</h2>
    <a href="{{ url_for('compose_email') }}" class="btn btn-success mb-3">Compose New Email</a>
    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Sender</th>
                <th>Subject</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            {% for email in emails %}
                <tr>
                    <td>{{ email.sender }}</td>
                    <td>{{ email.subject }}</td>
                    <td><a href="{{ url_for('view_email', email_id=email.id) }}" class="btn btn-primary">View</a></td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
    <nav>
    <ul class="pagination">
        {% if page > 1 %}
        <li class="page-item">
            <a class="page-link" href="{{ url_for('index', page=page-1) }}" aria-label="Previous">
                <span aria-hidden="true">&laquo;</span> <!-- Left Arrow -->
            </a>
        </li>
        {% endif %}

        <li class="page-item disabled">
            <span class="page-link">Page {{ page }} of {{ total_pages }}</span>
        </li>

        {% if page < total_pages %}
        <li class="page-item">
            <a class="page-link" href="{{ url_for('index', page=page+1) }}" aria-label="Next">
                <span aria-hidden="true">&raquo;</span> <!-- Right Arrow -->
            </a>
        </li>
        {% endif %}
    </ul>
</nav>

</body>

</html>
